name: Build APK

# Chạy thủ công: tab Actions -> Build APK -> Run workflow.
# Không chạy theo push, tránh build thừa khi tải từng file lên bằng điện thoại.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Runner đã có sẵn Android SDK. Không dùng android-actions/setup-android:
      # action đó gọi `sdkmanager tools`, gói này không còn trong repository của Google.
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AlexReminder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: alex-reminder-apk
          path: AlexReminder.apk
          if-no-files-found: error

      # APK tải thẳng từ trang Releases, không bị gói trong file zip.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" AlexReminder.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Build ${{ github.run_number }}" \
            --notes "Commit $GITHUB_SHA" \
            --latest
